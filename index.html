<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="favicon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memorial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    padding: 60px 24px;
  }

  .statement {
    max-width: 640px;
    height: 100%;
    text-align: center;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'EB Garamond', serif;
    font-size: clamp(22px, 3.4vw, 34px);
    font-weight: 400;
    line-height: 1.5;
    color: var(--text);
    letter-spacing: 0.01em;
  }

  .statement em {
  }
</style>
</head>
<body>

<header>
  <nav aria-label="Primary">
    <a href="index.html" class="active">Home</a>
    <a href="./stories/index.html">Stories</a>
    <a href="./timeline/index.html">Timeline</a>
    <a href="./resources/index.html">Resources</a>
  </nav>

  <div class="header-controls">
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" placeholder="Search a name" aria-label="Search a name" id="nameSearch" autocomplete="off">
      <ul class="search-results" id="searchResults"></ul>
    </div>
  </div>
</header>

<main>
  <p class="statement">
    This is the unofficial memorial for victims of<br>
    Immigration and Customs Enforcement
  </p>
</main>


<footer>
This is a prototype.
</footer>

<script src="data.js"></script>
<script>
  document.querySelectorAll('nav a').forEach(link => {
    link.addEventListener('click', () => {
      link.classList.remove('pressed');
      void link.offsetWidth;
      link.classList.add('pressed');
    });
    link.addEventListener('animationend', () => {
      link.classList.remove('pressed');
    });
  });

  const input = document.getElementById('nameSearch');
  const resultsList = document.getElementById('searchResults');
  let highlightedIndex = -1;

  function escapeHtml(str) {
    return str.replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  function highlightMatch(name, query) {
    const idx = name.toLowerCase().indexOf(query.toLowerCase());
    if (idx === -1) return escapeHtml(name);
    const before = escapeHtml(name.slice(0, idx));
    const match = escapeHtml(name.slice(idx, idx + query.length));
    const after = escapeHtml(name.slice(idx + query.length));
    return before + '<mark>' + match + '</mark>' + after;
  }

  function goToProfile(id) {
    window.location.href = 'profile.html?id=' + id;
  }

  function renderResults(query) {
    resultsList.innerHTML = '';
    highlightedIndex = -1;

    if (!query) {
      resultsList.classList.remove('open');
      return;
    }

    const matches = profiles.filter(p => p.name.toLowerCase().includes(query.toLowerCase()));

    if (matches.length === 0) {
      const li = document.createElement('li');
      li.className = 'no-results';
      li.textContent = 'No names found';
      resultsList.appendChild(li);
    } else {
      matches.forEach(p => {
        const li = document.createElement('li');
        li.innerHTML = highlightMatch(p.name, query);
        li.addEventListener('click', () => goToProfile(p.id));
        resultsList.appendChild(li);
      });
    }

    resultsList.classList.add('open');
  }

  input.addEventListener('input', () => renderResults(input.value.trim()));
  input.addEventListener('focus', () => {
    if (input.value.trim()) renderResults(input.value.trim());
  });

  input.addEventListener('keydown', (e) => {
    const items = Array.from(resultsList.querySelectorAll('li:not(.no-results)'));
    if (!items.length) return;

    if (e.key === 'ArrowDown') {
      e.preventDefault();
      highlightedIndex = (highlightedIndex + 1) % items.length;
      items.forEach((li, i) => li.classList.toggle('highlighted', i === highlightedIndex));
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      highlightedIndex = (highlightedIndex - 1 + items.length) % items.length;
      items.forEach((li, i) => li.classList.toggle('highlighted', i === highlightedIndex));
    } else if (e.key === 'Enter') {
      if (highlightedIndex >= 0) items[highlightedIndex].click();
    } else if (e.key === 'Escape') {
      resultsList.classList.remove('open');
    }
  });

  document.addEventListener('click', (e) => {
    if (!e.target.closest('.search-wrap')) {
      resultsList.classList.remove('open');
    }
  });
</script>


</body>
</html>
